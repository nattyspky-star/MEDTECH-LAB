<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MedTech Quick Reference — คู่มืออ้างอิงงานเทคนิคการแพทย์</title>
<meta name="description" content="คู่มืออ้างอิงงานเทคนิคการแพทย์: ค่าอ้างอิง ค่าวิกฤต ขั้นตอนการตรวจ แอตลาสภาพใต้กล้องจุลทรรศน์ และ Flowchart การระบุเชื้อ — ใช้งานออฟไลน์บนมือถือได้">
<meta name="theme-color" content="#1B463C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MedTech Ref">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- โหลดฟอนต์แบบไม่บล็อกการแสดงผล (หน้าเว็บขึ้นทันทีด้วยฟอนต์ระบบ แล้วค่อยสลับ) -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="prefetch" href="atlas.js"><link rel="prefetch" href="flow.js">
<style>
  :root{
    --bg:#F3F6F5;
    --surface:#FFFFFF;
    --ink:#122E29;
    --ink-soft:#3F5651;
    --muted:#6B7C78;
    --line:#DCE6E2;
    --teal:#2F6F63;
    --teal-deep:#1B463C;
    --teal-tint:#E7F0EC;
    --amber:#B8863A;
    --amber-tint:#FBF1DF;
    --crit:#A73B2E;
    --crit-tint:#FBEAE7;
    --radius:10px;
    --font-scale:1;
  }
  :root[data-theme="dark"]{
    --bg:#0F1613;
    --surface:#1A2420;
    --ink:#E7F0EC;
    --ink-soft:#C4D3CD;
    --muted:#8AA098;
    --line:#2C3B35;
    --teal:#4FA593;
    --teal-deep:#7FCBB8;
    --teal-tint:#1E2F29;
    --amber:#D9A75C;
    --amber-tint:#2E2515;
    --crit:#E2685A;
    --crit-tint:#3A1D18;
  }
  html[data-fontscale="2"]{ font-size:112.5%; }
  html[data-fontscale="3"]{ font-size:125%; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{font-family:'IBM Plex Sans Thai','IBM Plex Sans',sans-serif;line-height:1.55;transition:background .15s,color .15s;}
  h1,h2,h3{font-family:'IBM Plex Serif',serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  a{color:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---- Top bar ---- */
  .topbar{
    position:sticky;top:0;z-index:20;background:var(--teal-deep);color:#EFF6F3;
    padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
    border-bottom:3px solid var(--amber);
  }
  .brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;}
  .brand .title{font-family:'IBM Plex Serif',serif;font-weight:600;font-size:19px;letter-spacing:.2px;}
  .brand .sub{font-size:12px;color:#B9D3CB;}
  .search-wrap{flex:1 1 280px;max-width:420px;position:relative;}
  .search-wrap input{
    width:100%;padding:10px 14px 10px 36px;border-radius:8px;border:1px solid transparent;
    background:#0F332B;color:#EFF6F3;font-size:14px;outline:none;
  }
  .search-wrap input::placeholder{color:#9DBAB1;}
  .search-wrap input:focus{border-color:var(--amber);}
  .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.7;}

  /* ---- Layout ---- */
  .layout{display:flex;flex:1;min-height:0;}
  nav.sections{
    width:230px;flex:0 0 230px;background:var(--surface);border-right:1px solid var(--line);
    padding:14px 10px;overflow-y:auto;
  }
  nav.sections .sec-btn{
    display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;background:none;border:none;
    padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px;color:var(--ink-soft);
    border-left:3px solid transparent;
  }
  nav.sections .sec-btn .n{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);}
  nav.sections .sec-btn:hover{background:var(--teal-tint);}
  nav.sections .sec-btn.active{background:var(--teal-tint);color:var(--teal-deep);font-weight:600;border-left-color:var(--teal);}
  nav.sections .tube-guide-btn{color:var(--teal-deep);font-weight:600;}
  nav.sections .nav-divider{height:1px;background:var(--line);margin:8px 6px 10px;}
  nav.sections .tool-nav-btn{color:var(--ink-soft);}
  nav.sections .tool-nav-btn.active{background:var(--teal-tint);color:var(--teal-deep);font-weight:600;border-left-color:var(--teal);}

  /* ---- Topbar tools (theme / font size) ---- */
  .topbar-tools{display:flex;gap:6px;flex:0 0 auto;}
  .icon-btn{
    background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#EFF6F3;
    width:36px;height:36px;border-radius:8px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.16);}

  /* ---- Test card actions (favorite / QR) ---- */
  .test-actions{display:flex;align-items:center;gap:4px;flex:0 0 auto;}
  .star-btn,.qr-btn{
    background:none;border:none;cursor:pointer;font-size:17px;padding:4px 6px;border-radius:6px;color:var(--muted);line-height:1;
  }
  .star-btn:hover,.qr-btn:hover{background:var(--teal-tint);}
  .star-btn.active{color:var(--amber);}
  .qr-block{background:var(--bg);}
  .qr-row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start;}
  .qr-canvas{width:128px;height:128px;flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;padding:4px;}
  .qr-link-col{flex:1 1 220px;min-width:200px;display:flex;flex-direction:column;gap:6px;align-items:flex-start;}
  .qr-link-input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12px;}

  /* ---- Calculators ---- */
  .calc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:16px;}
  .calc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;}
  .calc-card h3{font-size:15px;color:var(--teal-deep);margin-bottom:6px;}
  .calc-formula{font-size:12px;color:var(--muted);background:var(--bg);border-radius:6px;padding:6px 10px;margin-bottom:12px;}
  .calc-inputs{display:flex;flex-direction:column;gap:10px;margin-bottom:12px;}
  .calc-inputs label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
  .calc-inputs input,.calc-inputs select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px;font-weight:400;}
  .calc-result{background:var(--teal-tint);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--ink);min-height:20px;}

  /* ---- Critical values page ---- */
  .crit-subhead{font-size:16px;color:var(--crit);margin:24px 0 12px;}
  .crit-numeric-section{margin-bottom:10px;}
  .notify-list{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;}
  .notify-list li{background:var(--crit-tint);color:var(--crit);border-radius:8px;padding:10px 14px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .notify-list li.clickable{cursor:pointer;}
  .notify-list li.clickable:hover{filter:brightness(0.97);}

  /* ---- Team board ---- */
  .team-board-textarea{
    width:100%;min-height:220px;padding:14px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--surface);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:14px;resize:vertical;
  }

  main{flex:1;min-width:0;padding:22px 26px 60px;overflow-y:auto;}

  /* ---- Specimen / Tube Type Guide ---- */
  .tube-legend{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 18px;}
  .tube-chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;white-space:nowrap;}
  .tube-search-wrap{position:relative;max-width:480px;margin:0 0 22px;background:var(--surface);border:1px solid var(--line);}
  .tube-search-wrap input{width:100%;padding:10px 14px 10px 36px;border:none;border-radius:20px;font-size:14px;background:transparent;color:var(--ink);outline:none;}
  .tube-group{margin-bottom:26px;}
  .tube-group-head{display:flex;align-items:center;gap:10px;border-left:5px solid;padding:6px 0 6px 12px;margin-bottom:10px;}
  .tube-group-head h3{font-size:15px;color:var(--ink-soft);margin:0;}
  .tube-swatch{width:16px;height:16px;border-radius:4px;flex:0 0 auto;border:1px solid rgba(0,0,0,0.15);}
  .tube-count{font-size:12px;color:var(--muted);margin-left:auto;}
  .tube-table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .tube-table th{text-align:left;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--bg);}
  .tube-table td{padding:10px 12px;font-size:13.5px;border-bottom:1px solid var(--line);vertical-align:top;}
  .tube-row{cursor:pointer;}
  .tube-row:hover{background:var(--teal-tint);}
  .tube-row:last-child td{border-bottom:none;}
  .tube-test-name{font-weight:600;color:var(--ink);white-space:nowrap;}
  .tube-specimen-detail{color:var(--ink-soft);}
  .section-head{margin-bottom:6px;}
  .section-head h2{font-size:23px;color:var(--teal-deep);}
  .section-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px;}

  .category{margin-top:26px;}
  .category h3{font-size:15px;color:var(--ink-soft);text-transform:none;border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:12px;}

  .test-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .test-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
  .test-head:hover{background:#FAFCFB;}
  .test-head .name{font-weight:600;font-size:15px;color:var(--ink);}
  .test-head .specimen{font-size:12.5px;color:var(--muted);margin-top:2px;}
  .test-head .tat{font-size:12px;color:var(--teal-deep);font-weight:600;margin-top:3px;display:inline-block;background:var(--teal-tint);padding:2px 8px;border-radius:20px;}
  .chev{color:var(--muted);transition:transform .15s ease;flex:0 0 auto;}
  .test-card.open .chev{transform:rotate(180deg);}

  .test-body{padding:0 16px 16px;display:none;}
  .test-card.open .test-body{display:block;}

  table.params{width:100%;border-collapse:collapse;margin:6px 0 14px;font-size:13.5px;}
  table.params th{text-align:left;font-weight:600;color:var(--muted);font-size:11.5px;letter-spacing:.3px;padding:6px 10px;border-bottom:1px solid var(--line);}
  table.params td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
  table.params td.rng{font-family:'IBM Plex Mono',monospace;font-size:13px;}
  table.params tr:last-child td{border-bottom:none;}
  .crit-tag{display:inline-block;margin-top:2px;font-size:11.5px;background:var(--crit-tint);color:var(--crit);padding:1px 7px;border-radius:5px;font-family:'IBM Plex Mono',monospace;}

  .block{margin-top:12px;}
  .block h4{font-size:12px;letter-spacing:.3px;color:var(--teal-deep);margin:0 0 6px;font-weight:600;}
  .block ul{margin:0;padding-left:19px;}
  .block li{margin-bottom:4px;font-size:13.8px;}
  .block p{margin:0;font-size:13.8px;}
  .calctrl-block p{margin:3px 0;font-size:13.8px;}
  .qc-block h4{color:var(--amber);}
  .report-block h4{color:var(--teal-deep);}
  .report-example{
    font-family:'IBM Plex Mono',monospace;font-size:12.8px;line-height:1.6;color:var(--ink-soft);
    background:var(--bg);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;white-space:pre-wrap;
  }

  .art-panel{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px 14px;margin:14px 0 22px;
  }
  .art-panel h3{font-size:14px;color:var(--teal-deep);margin:0 0 3px;border:none;padding:0;}
  .art-panel .art-desc{font-size:12.5px;color:var(--muted);margin:0 0 12px;}
  .art-panel svg{width:100%;height:auto;display:block;}
  .art-panel .art-legend{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px;}
  .art-panel .art-legend .crit{color:var(--crit);font-weight:600;}
  .art-panel .art-links{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .art-panel .art-links a{display:inline-block;font-size:12px;color:var(--teal);text-decoration:none;}
  .art-panel .art-links a:hover{text-decoration:underline;}

  .photo-block .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px;}
  .photo-img-wrap{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#000;aspect-ratio:4/3;}
  .photo-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .photo-img-wrap .cap{position:absolute;left:0;right:0;bottom:0;font-size:11px;color:#fff;padding:5px 7px;background:rgba(0,0,0,0.55);}
  .photo-img-wrap .photo-del{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,0.55);color:#fff;font-size:12px;line-height:1;cursor:pointer;}
  .photo-img-wrap .photo-del:hover{background:rgba(167,59,46,0.9);}
  .pdf-item{background:var(--teal-tint);display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--teal-deep);padding:10px 8px;gap:4px;}
  .pdf-item .pdf-icon{font-size:32px;line-height:1;}
  .pdf-item .pdf-filename{font-size:11px;text-align:center;word-break:break-word;max-width:100%;font-weight:600;}
  .pdf-item .cap{position:static;background:none;color:var(--muted);padding:0;font-size:10.5px;}
  .pdf-item:hover{filter:brightness(0.97);}
  .photo-hint{font-size:12px;color:var(--muted);margin:6px 0 4px;}
  .upload-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;align-items:center;}
  .upload-btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--teal-deep);background:var(--teal-tint);border:1px solid var(--teal);border-radius:20px;padding:7px 14px;cursor:pointer;white-space:nowrap;}
  .upload-btn-cam{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line);}
  .upload-btn:hover{filter:brightness(0.97);}
  .upload-btn input[type="file"]{display:none;}
  .caption-input{flex:1;min-width:160px;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);}
  .upload-status{font-size:12px;color:var(--muted);margin-top:6px;min-height:14px;}
  .user-photos{margin-top:4px;}

  .note-area{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
  .note-area h4{font-size:12px;color:var(--muted);margin:0 0 6px;font-weight:600;}
  .note-area textarea{
    width:100%;min-height:60px;resize:vertical;border:1px solid var(--line);border-radius:8px;
    padding:9px 10px;font-family:inherit;font-size:13.5px;background:#FCFDFC;color:var(--ink);
  }
  .note-status{font-size:11px;color:var(--muted);margin-top:4px;height:14px;}

  .search-results-head{font-size:13px;color:var(--muted);margin-bottom:14px;}
  .badge-path{display:inline-block;font-size:11px;background:var(--teal-tint);color:var(--teal-deep);padding:2px 8px;border-radius:6px;margin-bottom:6px;}

  .disclaimer{
    margin:26px 0 0;padding:12px 14px;background:var(--amber-tint);border:1px solid #E8D6AE;
    border-radius:8px;font-size:12.5px;color:#6B5322;
  }

  /* mobile */
  @media (max-width:760px){
    .layout{flex-direction:column;}
    nav.sections{
      width:100%;flex:0 0 auto;display:flex;overflow-x:auto;gap:4px;padding:10px 10px;
      border-right:none;border-bottom:1px solid var(--line);white-space:nowrap;
    }
    nav.sections .sec-btn{border-left:none;border-bottom:3px solid transparent;flex:0 0 auto;width:auto;}
    nav.sections .sec-btn.active{border-left:none;border-bottom-color:var(--teal);}
    main{padding:16px 14px 50px;}
    .brand .sub{display:none;}
  }
  /* ===== Performance: ข้ามการวาดการ์ด/หมวดที่อยู่นอกจอ ===== */
  .category, .tube-group{content-visibility:auto;contain-intrinsic-size:auto 600px;}
  .test-card:not(.open){content-visibility:auto;contain-intrinsic-size:auto 76px;}
  html{-webkit-text-size-adjust:100%;}
  .test-card{scroll-margin-top:84px;} @media (max-width:760px){ .test-card{scroll-margin-top:130px;} }
  button{font-family:inherit;}
  :root[data-theme="dark"] .topbar{background:#12302A;}
  :root[data-theme="dark"] .at-tab.on{background:#2F6F63;border-color:#2F6F63;}
  .topbar{padding-top:max(14px, env(safe-area-inset-top));}
  @media (max-width:760px){
    .topbar{padding:10px 12px;gap:10px;}
    .search-wrap{order:3;flex:1 1 100%;max-width:none;}
    .search-wrap input{font-size:16px;} /* กัน iOS ซูมอัตโนมัติ */
    .test-head{padding:12px 12px;}
    .star-btn,.qr-btn{font-size:20px;padding:8px;}
    nav.sections .sec-btn{padding:10px 12px;}
    .art-panel{padding:12px;}
  }
  @media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important;transition:none !important;} }

  /* ===== Atlas ===== */
  .lazy-root{min-height:60vh;}
  .at-tabs{display:flex;gap:6px;align-items:center;margin:14px 0 10px;flex-wrap:wrap;}
  .at-tab{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;}
  .at-tab.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}
  .at-score{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:13px;color:var(--teal-deep);background:var(--teal-tint);border-radius:20px;padding:5px 10px;}
  .at-chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
  .at-chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:20px;padding:7px 12px;font-size:13px;cursor:pointer;white-space:nowrap;}
  .at-chip span{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);margin-left:2px;}
  .at-chip.on{background:var(--teal-tint);border-color:var(--teal);color:var(--teal-deep);font-weight:600;}
  .at-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 0 14px;}
  .at-search{flex:1 1 240px;padding:10px 14px;border:1px solid var(--line);border-radius:20px;background:var(--surface);color:var(--ink);font-size:16px;outline:none;}
  .at-search:focus{border-color:var(--teal);}
  .at-toggle{font-size:13px;color:var(--ink-soft);display:flex;gap:6px;align-items:center;cursor:pointer;user-select:none;}
  .at-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;}
  @media (max-width:420px){ .at-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;} }
  .at-card{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 8px 10px;cursor:pointer;color:var(--ink);content-visibility:auto;contain-intrinsic-size:auto 250px;}
  .at-card:hover{border-color:var(--teal);}
  .at-card.crit{border-color:#E4B7AF;}
  .at-img{aspect-ratio:200/214;width:100%;color:var(--ink-soft);}

        procedure:[

/* ===================== STATE & STORAGE (localStorage — ใช้งานได้บน GitHub Pages/โฮสต์ทั่วไป) ===================== */
let state = { sectionId: SECTIONS[0].id, query:'', openTest:null, view:'main', tubeQuery:'', calcQuery:'' };

/* ---------- Preferences: theme, font size, favorites, usage stats (localStorage — device-level) ---------- */
function getPref(key, fallback){
  try{ const v = localStorage.getItem('mtq_pref_'+key); return v===null ? fallback : v; }catch(e){ return fallback; }
}
function setPref(key, val){ try{ localStorage.setItem('mtq_pref_'+key, val); }catch(e){} }
function getFavorites(){ try{ return JSON.parse(localStorage.getItem('mtq_favorites')||'[]'); }catch(e){ return []; } }
function setFavorites(arr){ try{ localStorage.setItem('mtq_favorites', JSON.stringify(arr)); }catch(e){} }
function isFavorite(id){ return getFavorites().includes(id); }
function toggleFavorite(id, evt){
  if(evt) evt.stopPropagation();
  let favs = getFavorites();
  favs = favs.includes(id) ? favs.filter(x=>x!==id) : favs.concat([id]);
  setFavorites(favs);
  if(state.view==='favorites'){ render(); return; }
  rerenderCard(id);
}
function getUsageStats(){ try{ return JSON.parse(localStorage.getItem('mtq_usage')||'{}'); }catch(e){ return {}; } }
function bumpUsage(id){
  try{
    const stats = getUsageStats();
    stats[id] = (stats[id]||0) + 1;
    localStorage.setItem('mtq_usage', JSON.stringify(stats));
  }catch(e){}
}
function findTestById(id){
  if(!_testIndex) findAllTests();
  if(_testIndex[id]) return _testIndex[id];
  for(const sec of SECTIONS){
    for(const cat of sec.categories){
      for(const t of cat.tests){
        if(t.id===id) return { sec, cat, test:t };
      }
    }
  }
  return null;
}

/* ---------- Photo gallery (เพิ่มภาพเองจากมือถือ/คอมพิวเตอร์ — เก็บใน localStorage ของเบราว์เซอร์นี้) ---------- */
function resizeImageToBlob(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('canvas_failed')), 'image/jpeg', quality);
      };
      img.onerror = () => reject(new Error('image_decode_failed'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('file_read_failed'));
    reader.readAsDataURL(file);
  });
}
function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(new Error('blob_read_failed'));
    r.readAsDataURL(blob);
  });
}
/* เก็บรูป/PDF ใน IndexedDB (จุได้มากกว่า localStorage ~5MB และไม่ต้อง parse JSON ก้อนใหญ่ทุกครั้ง)
   ย้ายข้อมูลเก่าจาก localStorage ให้อัตโนมัติ; ถ้าเบราว์เซอร์ไม่รองรับ IndexedDB จะใช้ localStorage แทน */
let _photoDB = null;
function photoDB(){
  if(_photoDB) return _photoDB;
  _photoDB = new Promise((resolve)=>{
    try{
      if(!('indexedDB' in window)) return resolve(null);
      const req = indexedDB.open('mtq_photos', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('photos');
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
      req.onblocked = () => resolve(null);
    }catch(e){ resolve(null); }
  });
  return _photoDB;
}
function _lsPhotos(testId){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+'photos_'+testId) || '[]'); }catch(e){ return []; } }
async function getPhotos(testId){
  const db = await photoDB();
  if(!db) return _lsPhotos(testId);
  const val = await new Promise(res=>{
    try{ const r = db.transaction('photos','readonly').objectStore('photos').get(testId); r.onsuccess=()=>res(r.result); r.onerror=()=>res(undefined); }catch(e){ res(undefined); }
  });
  if(val) return val;
  const legacy = _lsPhotos(testId);            // migrate old data once
  if(legacy.length && await setPhotos(testId, legacy)){ try{ localStorage.removeItem(LS_PREFIX+'photos_'+testId); }catch(e){} }
  return legacy;
}
async function setPhotos(testId, arr){
  const db = await photoDB();
  if(!db){ try{ localStorage.setItem(LS_PREFIX+'photos_'+testId, JSON.stringify(arr)); return true; }catch(e){ return false; } }
  return new Promise(res=>{
    try{ const tx = db.transaction('photos','readwrite'); tx.objectStore('photos').put(arr, testId); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); tx.onabort=()=>res(false); }catch(e){ res(false); }
  });
}

async function handlePhotoSelect(testId, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  const statusEl = document.getElementById('upload-status-'+testId);
  const captionEl = document.getElementById('caption-'+testId);
  const caption = captionEl ? captionEl.value.trim() : '';
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name||'');
  if(statusEl) statusEl.textContent = isPdf ? 'กำลังประมวลผล PDF...' : 'กำลังประมวลผลภาพ...';
  try{
    let dataUrl, kind;
    if(isPdf){
      const maxPdfBytes = 3 * 1024 * 1024;
      if(file.size > maxPdfBytes){
        if(statusEl) statusEl.textContent = 'ไฟล์ PDF ใหญ่เกินไป (จำกัด 3MB ในเวอร์ชันนี้ เนื่องจากพื้นที่จัดเก็บของเบราว์เซอร์มีจำกัด)';
        return;
      }
      dataUrl = await blobToDataURL(file);
      kind = 'pdf';
    } else {
      const resized = await resizeImageToBlob(file, 1024, 0.72);
      dataUrl = await blobToDataURL(resized);
      kind = 'image';
    }
    const photos = await getPhotos(testId);
    photos.unshift({
      id:'p'+Date.now()+Math.random().toString(36).slice(2,7), caption, ts:new Date().toISOString(),
      dataUrl, kind, fileName: file.name || (isPdf ? 'document.pdf' : 'photo.jpg')
    });
    const ok = await setPhotos(testId, photos);
    if(!ok){
      if(statusEl) statusEl.textContent = 'พื้นที่จัดเก็บของเบราว์เซอร์เต็ม ลองลบไฟล์เก่าบางส่วนก่อน';
      return;
    }
    inputEl.value = '';
    if(captionEl) captionEl.value = '';
    if(statusEl) statusEl.textContent = (isPdf ? 'เพิ่ม PDF สำเร็จ' : 'เพิ่มภาพสำเร็จ') + ' (เก็บไว้ในเบราว์เซอร์นี้เท่านั้น)';
    renderUserPhotoGallery(testId);
  }catch(e){
    if(statusEl) statusEl.textContent = 'เพิ่มไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง';
  }
}

async function handlePhotoDelete(testId, photoId){
  if(!confirm('ลบไฟล์นี้ใช่หรือไม่? การลบไม่สามารถย้อนกลับได้')) return;
  const photos = (await getPhotos(testId)).filter(p => p.id !== photoId);
  await setPhotos(testId, photos);
  renderUserPhotoGallery(testId);
}

function loadAndRenderUserPhotos(testId){
  renderUserPhotoGallery(testId);
}

async function renderUserPhotoGallery(testId){
  const container = document.getElementById('user-photos-'+testId);
  if(!container) return;
  const photos = await getPhotos(testId);
  if(!photos.length){
    container.innerHTML = '<p class="photo-hint">ยังไม่มีไฟล์ที่บันทึกไว้สำหรับรายการนี้ (จัดเก็บเฉพาะในเบราว์เซอร์นี้) — เพิ่มรูปภาพหรือ PDF แรกได้จากปุ่มด้านล่าง</p>';
    return;
  }
  container.innerHTML = `<div class="photo-grid">${photos.map(p => {
    const delBtn = `<button class="photo-del" onclick="handlePhotoDelete('${testId}','${p.id}')" title="ลบไฟล์นี้">✕</button>`;
    if(p.kind === 'pdf'){
      return `<a class="photo-img-wrap pdf-item" href="${p.dataUrl}" target="_blank" rel="noopener">
        <div class="pdf-icon">📄</div>
        <div class="pdf-filename">${esc(p.fileName||'PDF')}</div>
        ${p.caption? `<div class="cap">${esc(p.caption)}</div>`:''}
        ${delBtn}
      </a>`;
    }
    return `<div class="photo-img-wrap">
      <img src="${p.dataUrl}" alt="${esc(p.caption||'')}" loading="lazy">
      ${p.caption? `<div class="cap">${esc(p.caption)}</div>`:''}
      ${delBtn}
    </div>`;
  }).join('')}</div>`;
}

function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
let _allTests = null, _testIndex = null;
function findAllTests(){
  if(_allTests) return _allTests;
  const out = [];
  SECTIONS.forEach(sec => sec.categories.forEach(cat => cat.tests.forEach(t => out.push({sec, cat, test:t}))));
  _testIndex = {}; out.forEach(o => { _testIndex[o.test.id] = o; });
  return (_allTests = out);
}

function inferTubeType(specimenText){
  const s = specimenText || '';
  for(const t of TUBE_TYPES){ if(t.match(s)) return t; }
  return TUBE_OTHER;
}

        const tube = inferTubeType(test.specimen);
        rows.push({ sec, cat, test, tube });
      });

    r.test.name.toLowerCase().includes(q) ||

/* ===================== INTERACTIVE CALCULATORS ===================== */
function calcReadNum(id){ const el = document.getElementById(id); return el ? parseFloat(el.value) : NaN; }

function computeAnionGap(){
  const na = calcReadNum('ag-na'), cl = calcReadNum('ag-cl'), hco3 = calcReadNum('ag-hco3');
  const out = document.getElementById('ag-result');
  if(!out) return;
  if(isNaN(na)||isNaN(cl)||isNaN(hco3)){ out.innerHTML = '<span class="photo-hint">กรอกค่าให้ครบทั้ง 3 ช่องเพื่อคำนวณ</span>'; return; }
  const ag = na - (cl + hco3);
  const interp = (ag>=8 && ag<=16) ? 'อยู่ในเกณฑ์ปกติ (8–16 mmol/L)'
    : (ag>16 ? 'สูงกว่าปกติ — พิจารณา High Anion Gap Metabolic Acidosis (mnemonic: MUDPILES)'
    : 'ต่ำกว่าปกติ — พิจารณา hypoalbuminemia, paraproteinemia หรือตรวจสอบข้อผิดพลาดจากห้องปฏิบัติการ');
  out.innerHTML = `Anion Gap = <strong>${ag.toFixed(1)} mmol/L</strong><br>${interp}`;
}

function computeCorrectedCa(){
  const ca = calcReadNum('cca-ca'), alb = calcReadNum('cca-alb');
  const out = document.getElementById('cca-result');
  if(!out) return;
  if(isNaN(ca)||isNaN(alb)){ out.innerHTML = '<span class="photo-hint">กรอกค่าให้ครบทั้ง 2 ช่องเพื่อคำนวณ</span>'; return; }
  const corrected = ca + 0.8*(4.0-alb);
  const interp = (corrected>=8.6 && corrected<=10.0) ? 'อยู่ในเกณฑ์ปกติ (8.6–10.0 mg/dL)'
    : (corrected>10.0 ? 'สูงกว่าปกติ (Hypercalcemia)' : 'ต่ำกว่าปกติ (Hypocalcemia)');
  out.innerHTML = `Corrected Calcium = <strong>${corrected.toFixed(2)} mg/dL</strong><br>${interp}`;
}

function computeOsmolalGap(){
  const na = calcReadNum('og-na'), glu = calcReadNum('og-glu'), bun = calcReadNum('og-bun'), measured = calcReadNum('og-measured');
  const out = document.getElementById('og-result');
  if(!out) return;
  if(isNaN(na)||isNaN(glu)||isNaN(bun)||isNaN(measured)){ out.innerHTML = '<span class="photo-hint">กรอกค่าให้ครบทั้ง 4 ช่องเพื่อคำนวณ</span>'; return; }
  const calcOsm = 2*na + glu/18 + bun/2.8;
  const gap = measured - calcOsm;
  const interp = gap <= 10 ? 'Osmolal Gap ปกติ (≤10 mOsm/kg)' : 'Osmolal Gap สูง (>10 mOsm/kg) — พิจารณาสารพิษที่ไม่ได้วัดโดยตรง เช่น Methanol, Ethylene Glycol, Ethanol — แจ้งแพทย์ทันทีหากสงสัยทางคลินิก';
  out.innerHTML = `Calculated Osmolality = <strong>${calcOsm.toFixed(1)} mOsm/kg</strong><br>Osmolal Gap = <strong>${gap.toFixed(1)} mOsm/kg</strong><br>${interp}`;
}

function computeCorrectedWBC(){
  const wbc = calcReadNum('cwbc-wbc'), nrbc = calcReadNum('cwbc-nrbc');
  const out = document.getElementById('cwbc-result');
  if(!out) return;
  if(isNaN(wbc)||isNaN(nrbc)){ out.innerHTML = '<span class="photo-hint">กรอกค่าให้ครบทั้ง 2 ช่องเพื่อคำนวณ</span>'; return; }
  const corrected = wbc * 100 / (100 + nrbc);
  out.innerHTML = `Corrected WBC = <strong>${corrected.toFixed(0)} cells/µL</strong><br>(จาก WBC ดิบ ${wbc} cells/µL และ NRBC ${nrbc}/100 WBC)`;
}

function computeCrCl(){
  const age = calcReadNum('crcl-age'), weight = calcReadNum('crcl-weight'), scr = calcReadNum('crcl-scr');
  const sexEl = document.getElementById('crcl-sex');
  const sex = sexEl ? sexEl.value : 'male';
  const out = document.getElementById('crcl-result');
  if(!out) return;
  if(isNaN(age)||isNaN(weight)||isNaN(scr) || scr===0){ out.innerHTML = '<span class="photo-hint">กรอกค่าให้ครบทั้ง 3 ช่องเพื่อคำนวณ (Scr ต้องไม่เป็น 0)</span>'; return; }
  let crcl = ((140-age)*weight)/(72*scr);
  if(sex==='female') crcl *= 0.85;
  out.innerHTML = `Estimated CrCl (Cockcroft-Gault) = <strong>${crcl.toFixed(1)} mL/min</strong><br><span class="photo-hint">ค่าประมาณเท่านั้น — การเก็บปัสสาวะ 24 ชม.จริงให้ค่าที่แม่นยำกว่าสำหรับการตัดสินใจทางคลินิกที่สำคัญ</span>`;
}

      <label>Na (mmol/L)<input type="number" id="ag-na" oninput="computeAnionGap()"></label>
      <label>Cl (mmol/L)<input type="number" id="ag-cl" oninput="computeAnionGap()"></label>

  { key:'cca', title:'Corrected Calcium', formula:'Ca + 0.8 × (4.0 − Albumin)', html:`
    <div class="calc-inputs">
      <label>Measured Calcium (mg/dL)<input type="number" step="0.1" id="cca-ca" oninput="computeCorrectedCa()"></label>

  { key:'cwbc', title:'Corrected WBC (เมื่อมี NRBC)', formula:'WBC × 100 ÷ (100 + NRBC/100WBC)', html:`

  { key:'crcl', title:'Creatinine Clearance (Cockcroft-Gault)', formula:'[(140−อายุ)×น้ำหนัก] ÷ (72×Scr) ×0.85 ถ้าเป็นหญิง', html:`
    <div class="calc-inputs">
      <label>อายุ (ปี)<input type="number" id="crcl-age" oninput="computeCrCl()"></label>
      <label>น้ำหนัก (kg)<input type="number" id="crcl-weight" oninput="computeCrCl()"></label>

        <select id="crcl-sex" onchange="computeCrCl()">
          <option value="male">ชาย</option>

function saveTeamBoard(){
  const ta = document.getElementById('team-board-text');
  const status = document.getElementById('team-board-status');
  if(!ta) return;
  try{
    localStorage.setItem('mtq_team_board', JSON.stringify({ text: ta.value, updatedAt: new Date().toISOString() }));
    if(status) status.textContent = 'บันทึกแล้ว (เก็บเฉพาะในเบราว์เซอร์นี้) ✓';

    <button class="sec-btn ${s.id===state.sectionId && !state.query && state.view==='main' ? 'active':''}" onclick="selectSection('${s.id}')">
      <span class="n">${String(i+1).padStart(2,'0')}</span> ${esc(s.name)}
    </button>`).join('')}</nav>`;
}

let qrOpenFor = null;
function toggleQR(id, evt){
  if(evt) evt.stopPropagation();
  const prev = qrOpenFor;
  qrOpenFor = (qrOpenFor === id) ? null : id;
  if(qrOpenFor && state.openTest !== id){ state.openTest = id; }
  if(prev && prev!==id) rerenderCard(prev);
  rerenderCard(id);
  if(qrOpenFor === id) loadScript('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').then(()=>renderQRCanvas(id)).catch(()=>renderQRCanvas(id));
}
function getDeepLink(id){
  return location.origin + location.pathname + '#test=' + id;
}
function copyDeepLink(id, evt){
  if(evt) evt.stopPropagation();
  const link = getDeepLink(id);
  const statusEl = document.getElementById('copy-status-'+id);
  const done = (ok)=>{ if(statusEl) statusEl.textContent = ok ? 'คัดลอกลิงก์แล้ว ✓' : 'คัดลอกไม่สำเร็จ ลองคัดลอกด้วยตนเอง'; };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(link).then(()=>done(true)).catch(()=>done(false));
  } else { done(false); }
}
function renderQRCanvas(id){
  const el = document.getElementById('qr-canvas-'+id);
  if(!el) return;
  el.innerHTML = '';
  if(window.QRCode){
    try{ new QRCode(el, { text:getDeepLink(id), width:128, height:128, correctLevel:QRCode.CorrectLevel.M }); }
    catch(e){ el.innerHTML = '<p class="photo-hint">สร้าง QR ไม่สำเร็จ</p>'; }
  } else {
    el.innerHTML = '<p class="photo-hint">ไลบรารี QR ยังโหลดไม่เสร็จ/ไม่มีอินเทอร์เน็ต — ใช้ลิงก์ด้านล่างแทนได้</p>';
  }
}
function renderQRBlock(test){
  if(qrOpenFor !== test.id) return '';
  return `<div class="block qr-block" onclick="event.stopPropagation()">
    <h4>QR / ลิงก์ด่วนไปยังรายการนี้</h4>
    <div class="qr-row">
      <div class="qr-canvas" id="qr-canvas-${test.id}"><p class="photo-hint">กำลังสร้าง QR...</p></div>
      <div class="qr-link-col">
        <input type="text" readonly class="qr-link-input" value="${esc(getDeepLink(test.id))}" onclick="this.select()">
        <button class="upload-btn" onclick="copyDeepLink('${test.id}', event)">📋 คัดลอกลิงก์</button>
        <div class="upload-status" id="copy-status-${test.id}"></div>
        <p class="photo-hint">พิมพ์ QR นี้ติดผนังห้องแล็บ — สแกนแล้วเปิดตรงรายการนี้ทันที</p>
      </div>
    </div>
  </div>`;
}

function renderTestCard(test, pathLabel){
  const isOpen = state.openTest === test.id;
  const fav = isFavorite(test.id);
  const paramsHtml = (test.params||[]).map(p => `
    <tr><td>${esc(p.name)}</td><td class="rng">${esc(p.range)}${p.critical? `<br><span class="crit-tag">Critical: ${esc(p.critical)}</span>`:''}</td></tr>
  `).join('');
  return `
  <div class="test-card ${isOpen?'open':''}" id="card-${test.id}" data-path="${esc(pathLabel||'')}">
    <div class="test-head" onclick="toggleTest('${test.id}')">
      <div>
        ${pathLabel? `<div class="badge-path">${esc(pathLabel)}</div>`:''}
        <div class="name">${esc(test.name)}</div>
        ${test.specimen? `<div class="specimen">สิ่งส่งตรวจ: ${esc(test.specimen)}</div>`:''}
        ${test.tat? `<div class="tat">⏱ TAT: ${esc(test.tat)}</div>`:''}
      </div>
      <div class="test-actions">
        <button class="star-btn ${fav?'active':''}" onclick="toggleFavorite('${test.id}', event)" title="${fav?'เอาออกจากรายการโปรด':'บันทึกเป็นรายการโปรด'}">${fav?'⭐':'☆'}</button>
        <button class="qr-btn" onclick="toggleQR('${test.id}', event)" title="QR/ลิงก์ด่วน">🔗</button>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </div>
    ${isOpen ? `<div class="test-body">
      ${renderQRBlock(test)}
      ${test.params? `<table class="params"><thead><tr><th>รายการ</th><th>ค่าอ้างอิง</th></tr></thead><tbody>${paramsHtml}</tbody></table>`:''}
      ${test.method? `<div class="block"><h4>วิธี / หลักการ</h4><p>${esc(test.method)}</p></div>`:''}
      ${test.procedure? `<div class="block"><h4>ขั้นตอนปฏิบัติ</h4><ul>${test.procedure.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
      ${(test.cal || test.ctrl)? `<div class="block calctrl-block"><h4>Calibration &amp; Control</h4>
        ${test.cal? `<p><strong>Calibration:</strong> ${esc(test.cal)}</p>`:''}
        ${test.ctrl? `<p><strong>Control (IQC):</strong> ${esc(test.ctrl)}</p>`:''}
      </div>`:''}
      ${test.qc? `<div class="block qc-block"><h4>QC / Troubleshooting</h4><ul>${test.qc.map(p=>`<li>${esc(p)}</li>`).join('')}</ul></div>`:''}
      ${test.report? `<div class="block report-block"><h4>ตัวอย่างการรายงานผล</h4><div class="report-example">${esc(test.report)}</div></div>`:''}
      ${renderPhotoBlock(test)}
      <div class="note-area">
        <h4>บันทึกส่วนตัว (เฉพาะอุปกรณ์นี้ของคุณ)</h4>
        <textarea id="note-${test.id}" placeholder="เช่น ค่าปกติเฉพาะของเครื่อง/ห้องแล็บของคุณ, ข้อควรระวังเพิ่มเติม..." onblur="handleNoteBlur('${test.id}')"></textarea>
        <div class="note-status" id="status-${test.id}"></div>
      </div>
    </div>` : ''}
  </div>`;
}

function renderPhotoBlock(test){
  const preset = (test.photos && test.photos.items) || [];
  return `<div class="block photo-block">
    <h4>คลังภาพ/เอกสารของรายการนี้ (เพิ่มรูปภาพหรือไฟล์ PDF เองได้จากมือถือหรือคอมพิวเตอร์)</h4>
    ${test.photos && test.photos.note? `<p style="color:var(--muted);font-size:12.5px;margin:0 0 8px;">${esc(test.photos.note)}</p>`:''}
    ${preset.length? `
      <p class="photo-hint" style="margin-top:0;">ภาพอ้างอิงจากทีมพัฒนา</p>
      <div class="photo-grid">
        ${preset.map(it=>`
          <div class="photo-img-wrap">
            <img src="${esc(it.src)}" alt="${esc(it.caption||test.name)}" loading="lazy">
            ${it.caption? `<div class="cap">${esc(it.caption)}</div>`:''}
          </div>`).join('')}
      </div>`:''}
    <p class="photo-hint" style="margin-top:${preset.length?'10px':'0'};">ภาพและเอกสารที่ห้องปฏิบัติการของคุณบันทึกไว้ (เช่น ภาพเซลล์/เชื้อที่พบจริง, ไฟล์ PDF ผลตรวจ/เอกสารอ้างอิง)</p>
    <div id="user-photos-${test.id}" class="user-photos"><p class="photo-hint">กำลังโหลด...</p></div>
    <div class="upload-row">
      <label class="upload-btn">
        🖼️ เลือกรูปภาพ/PDF จากเครื่อง
        <input type="file" accept="image/*,application/pdf" onchange="handlePhotoSelect('${test.id}', this)">
      </label>
      <label class="upload-btn upload-btn-cam">
        📷 ถ่ายรูปใหม่
        <input type="file" accept="image/*" capture="environment" onchange="handlePhotoSelect('${test.id}', this)">
      </label>
      <input type="text" id="caption-${test.id}" class="caption-input" placeholder="คำอธิบาย (ไม่บังคับ)">
    </div>
    <div class="upload-status" id="upload-status-${test.id}"></div>
  </div>`;
}

function renderArtPanel(sectionId){
  const art = SECTION_ART[sectionId];
  if(!art) return '';
  return `
    <div class="art-panel">
      <h3>${esc(art.title)}</h3>
      <p class="art-desc">${esc(art.desc)}</p>
      ${art.svg}
      ${art.legend? `<div class="art-legend">${esc(art.legend)}</div>`:''}
      ${ART_TO_ATLAS[sectionId]? `<div class="art-links"><button class="upload-btn" onclick="showAtlas('${ART_TO_ATLAS[sectionId]}')">🔬 เปิดแอตลาสภาพใต้กล้องของหมวดนี้</button></div>`:''}
      ${art.links? `<div class="art-links">${art.links.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.label)}</a>`).join('')}</div>`:''}
    </div>
  `;
}

function renderSectionView(){
  const sec = SECTIONS.find(s=>s.id===state.sectionId);
  return `
    <div class="section-head">
      <h2>${esc(sec.name)}</h2>
      <p>${esc(sec.sub)}</p>
    </div>
    ${renderArtPanel(sec.id)}
    ${sec.categories.map(cat => `
      <div class="category">
        <h3>${esc(cat.name)}</h3>
        ${cat.tests.map(t=>renderTestCard(t)).join('')}
      </div>
    `).join('')}
    <div class="disclaimer">ค่าอ้างอิงในแอปนี้เป็นค่ามาตรฐานทั่วไปสำหรับผู้ใหญ่ เพื่อใช้ทบทวนความจำเท่านั้น ค่าจริงอาจแตกต่างกันตามน้ำยา เครื่องมือ และ SOP ของแต่ละห้องปฏิบัติการ — ให้ยึดค่าที่ห้องปฏิบัติการของท่านกำหนดเป็นหลักเสมอ</div>
  `;
}

function renderSearchView(){
  const q = state.query.trim().toLowerCase();
  const all = findAllTests();
  const matches = all.filter(o => {
    if(!o._hay) o._hay = [o.sec.name, o.sec.sub, o.cat.name, o.test.name, o.test.specimen, o.test.method, ...(o.test.params||[]).map(p=>p.name)].join(' ').toLowerCase();
    return o._hay.includes(q);
  }).slice(0, 60);
  return `
    <div class="section-head"><h2>ผลการค้นหา</h2></div>
    <div class="search-results-head">พบ ${matches.length} รายการสำหรับ "${esc(state.query)}"</div>
    ${matches.map(({sec,cat,test}) => renderTestCard(test, sec.name + ' › ' + cat.name)).join('') || '<p style="color:var(--muted)">ไม่พบรายการที่ตรงกัน ลองใช้คำค้นอื่น</p>'}
  `;
}

const VIEW_RENDERERS = {
  atlas: () => `<div id="atlas-root" class="lazy-root"><p class="photo-hint">กำลังโหลดแอตลาส…</p></div>`,
  flow:  () => `<div id="flow-root" class="lazy-root"><p class="photo-hint">กำลังโหลด Flowchart…</p></div>`,
  tubeGuide: renderTubeGuideView,
  critical: renderCriticalValuesView,
  calculators: renderCalculatorsView,
  favorites: renderFavoritesView,
  team: renderTeamBoardView,
  about: renderAboutView,
};

/* ===================== RENDER (ปรับประสิทธิภาพ) =====================
   - สร้างโครงหน้า (top bar + nav) ครั้งเดียว → ช่องค้นหาไม่ถูกสร้างใหม่ทุกครั้งที่พิมพ์
   - เปลี่ยนเฉพาะ <main> เมื่อเปลี่ยนหน้า และเปลี่ยนเฉพาะการ์ดที่ถูกกดเมื่อเปิด/ปิดรายการ
   - โหลด atlas.js / flow.js เฉพาะเมื่อเปิดหน้านั้น (lazy)
   ===================================================================== */
const ART_TO_ATLAS = { heme:'wbc', micro:'bact', ua:'urine', para:'spara', bb:'rbc' };
const _scripts = {};
function loadScript(src){
  if(_scripts[src]) return _scripts[src];
  return (_scripts[src] = new Promise((res, rej)=>{
    const el = document.createElement('script'); el.src = src; el.async = true;
    el.onload = ()=>res(); el.onerror = ()=>{ delete _scripts[src]; rej(new Error('load '+src)); };
    document.head.appendChild(el);
  }));
}
function mainHTML(){
  if(state.view!=='main') return VIEW_RENDERERS[state.view] ? VIEW_RENDERERS[state.view]() : renderSectionView();
  return state.query.trim() ? renderSearchView() : renderSectionView();
}
function renderShell(){
  const app = document.getElementById('app');
  const themeIcon = getPref('theme','light')==='dark' ? '☀️' : '🌙';
  app.innerHTML = `
    <div class="topbar">
      <div class="brand">
        <div class="title">MedTech Quick Reference</div>
        <div class="sub">คู่มืออ้างอิงงานเทคนิคการแพทย์ · ทุกเซคชั่นห้องปฏิบัติการ</div>
      </div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off" placeholder="ค้นหาการตรวจ, ค่าอ้างอิง..." value="${esc(state.query)}" oninput="handleSearch(this.value)">
      </div>
      <div class="topbar-tools">
        <button class="icon-btn" title="แอตลาสกล้องจุลทรรศน์" onclick="showAtlas()">🔬</button>
        <button class="icon-btn" title="ปรับขนาดตัวอักษร" onclick="cycleFontScale()">🔤</button>
        <button class="icon-btn" id="themeBtn" title="สลับโหมดมืด/สว่าง" onclick="toggleTheme()">${themeIcon}</button>
      </div>
    </div>
    <div class="layout">
      <div id="navWrap">${renderNav()}</div>
      <main id="mainEl"></main>
    </div>`;
}
/* อัปเดตสถานะ active ของเมนูโดยไม่สร้างใหม่ (คงตำแหน่งเลื่อนแนวนอนบนมือถือ) */
function syncNav(){
  document.querySelectorAll('#navWrap .sec-btn').forEach(b=>{
    const oc = b.getAttribute('onclick') || '';
    const m = /selectSection\('([^']+)'\)/.exec(oc);
    let on;
    if(m) on = m[1]===state.sectionId && !state.query && state.view==='main';
    else { const t = TOOL_NAV.find(t=>oc.indexOf(t.fn+'(')===0); on = !!t && t.view===state.view; }
    b.classList.toggle('active', on);
    if(on && b.scrollIntoView && window.innerWidth<=760){ try{ b.scrollIntoView({block:'nearest', inline:'center'}); }catch(e){} }
  });
}
function render(){
  if(!document.getElementById('mainEl')) renderShell();
  renderMain();
}
function renderMain(){
  const m = document.getElementById('mainEl');
  if(!m){ render(); return; }
  m.innerHTML = mainHTML();
  syncNav();
  afterMain();
}
function afterCardOpen(id){
  const ta = document.getElementById('note-'+id);
  if(ta) ta.value = loadNote(id);
  loadAndRenderUserPhotos(id);
}
function rerenderCard(tid){
  const el = document.getElementById('card-'+tid);
  const found = findTestById(tid);
  if(!el || !found) return;
  el.outerHTML = renderTestCard(found.test, el.dataset.path || undefined);
  if(state.openTest === tid) afterCardOpen(tid);
}
function openTestById(id){
  const f = findTestById(id); if(!f) return;
  const m = document.getElementById('at-modal-wrap'); if(m && !m.hidden && window.ATLAS){ /* close atlas modal first */ m.hidden = true; m.innerHTML=''; document.documentElement.classList.remove('at-lock'); }
  jumpToTest(f.sec.id, id);
}
function openAtlasItem(id){ loadScript('atlas.js').then(()=>window.ATLAS.open(id)).catch(()=>alert('โหลดแอตลาสไม่สำเร็จ — ตรวจสอบการเชื่อมต่อ')); }
function afterMain(){
  if(state.openTest) afterCardOpen(state.openTest);
  if(state.view==='atlas'){
    const el = document.getElementById('atlas-root');
    loadScript('atlas.js').then(()=>{
      if(!el.isConnected) return;
      window.ATLAS.mount(el, { group: state.atlasGroup });
      state.atlasGroup = null;
      if(state.pendingAtlas){ window.ATLAS.open(state.pendingAtlas); state.pendingAtlas = null; }
    }).catch(()=>{ el.innerHTML = '<p class="photo-hint">โหลดแอตลาสไม่สำเร็จ — ต้องเปิดผ่านเว็บ (GitHub Pages) และวางไฟล์ atlas.js ไว้โฟลเดอร์เดียวกับ index.html</p>'; });
  }
  if(state.view==='flow'){
    const el = document.getElementById('flow-root');
    loadScript('flow.js').then(()=>{ if(el.isConnected) window.FLOW.mount(el, { openAtlas: openAtlasItem, openTest: openTestById }); })
      .catch(()=>{ el.innerHTML = '<p class="photo-hint">โหลด Flowchart ไม่สำเร็จ — วางไฟล์ flow.js ไว้โฟลเดอร์เดียวกับ index.html</p>'; });
  }
}

/* ===================== EVENT HANDLERS ===================== */
function selectSection(id){
  state.sectionId = id;
  state.query = '';
  state.openTest = null;
  state.view = 'main';
  render();
  document.querySelector('main').scrollTo(0,0);
}
function switchToView(viewName){
  state.view = viewName;
  state.query = '';
  render();
  const m = document.querySelector('main');
  if(m) m.scrollTo(0,0);
}
function showTubeGuide(){ switchToView('tubeGuide'); }
function showCriticalValues(){ switchToView('critical'); }
function showCalculators(){ switchToView('calculators'); }
function showFavorites(){ switchToView('favorites'); }
function showTeamBoard(){ switchToView('team'); }
function showAbout(){ switchToView('about'); }
function showAtlas(group){ state.atlasGroup = typeof group==='string' ? group : null; switchToView('atlas'); try{ history.replaceState(null,'','#view=atlas'); }catch(e){} }
function showFlow(){ switchToView('flow'); try{ history.replaceState(null,'','#view=flow'); }catch(e){} }
function handleTubeSearch(val){
  state.tubeQuery = val;
  render();
  const inp = document.getElementById('tubeSearchInput');
  if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}
function handleCalcSearch(val){
  state.calcQuery = val;
  render();
  const inp = document.getElementById('calcSearchInput');
  if(inp){ inp.focus(); inp.selectionStart = inp.selectionEnd = inp.value.length; }
}
function toggleTest(id){
  const prev = state.openTest;
  const opening = prev !== id;
  state.openTest = opening ? id : null;
  if(qrOpenFor && qrOpenFor !== state.openTest) qrOpenFor = null;
  if(opening){
    bumpUsage(id);
    try{ history.replaceState(null, '', '#test='+id); }catch(e){}
  } else {
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  }
  if(prev && prev !== id) rerenderCard(prev);
  rerenderCard(id);
  if(opening){
    const el = document.getElementById('card-'+id);
    if(el){ const r = el.getBoundingClientRect(); if(r.top < 60 || r.top > window.innerHeight*0.6) el.scrollIntoView({block:'start', behavior:'smooth'}); }
  }
}
function jumpToTest(sectionId, testId){
  state.sectionId = sectionId;
  state.query = '';
  state.view = 'main';
  state.openTest = testId;
  bumpUsage(testId);
  render();
  try{ history.replaceState(null, '', '#test='+testId); }catch(e){}
  setTimeout(()=>{
    const el = document.getElementById('card-'+testId);
    if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
  }, 30);
}
function openFromHash(){
  const v = /#view=(atlas|flow|tubeGuide|critical|calculators|favorites|team|about)/.exec(location.hash);
  if(v){ state.view = v[1]; state.query=''; return true; }
  const a = /#atlas=([a-zA-Z0-9_]+)/.exec(location.hash);
  if(a){ state.view = 'atlas'; state.pendingAtlas = a[1]; return true; }
  const m = /#test=([a-zA-Z0-9_]+)/.exec(location.hash);
  if(!m) return false;
  const found = findTestById(m[1]);
  if(!found) return false;
  state.sectionId = found.sec.id;
  state.view = 'main';
  state.query = '';
  state.openTest = found.test.id;
  return true;
}
let searchDebounce;
function handleSearch(val){
  state.query = val;
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(()=>{ if(state.view!=='main'){ state.view='main'; } state.openTest = null; renderMain(); const m=document.querySelector('main'); if(m) m.scrollTop=0; }, 180);
}
function handleNoteBlur(testId){
  const ta = document.getElementById('note-'+testId);
  const status = document.getElementById('status-'+testId);
  if(!ta) return;
  status.textContent = 'กำลังบันทึก...';
  saveNote(testId, ta.value, status);
}

if(openFromHash() && state.openTest){ render(); setTimeout(()=>{ const el=document.getElementById('card-'+state.openTest); if(el) el.scrollIntoView({block:'start'}); }, 60); }
else render();
window.addEventListener("hashchange", ()=>{ if(openFromHash()) render(); });

/* ---------- Offline support: Service Worker จริง (sw.js) — ใช้งานได้บน GitHub Pages (https) ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
